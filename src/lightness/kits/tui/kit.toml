# Textual app kit. See docs/kits.md for the archetypes this must cover.

# Parts always shown in full (not only in the index).
always = []

# The notes' testing bullet, per testing arm (bench --tests). try_goal: how try.md ends, per arm (default: none's). "after" also asks for tests on the first submit;
# "checks" also adds checks.md and has the harness run the checks.
[testing]
none = "Check the real app with the try command after each change. Write test files only if the task asks (then follow the headless_test part). With the try command (below), run the steps a user would and compare what it prints with the task."
first = "Before writing the app, write tests from the task's contract (follow the headless_test part). Then build the app until they pass. Use the try command to see what the app does. With the try command (below), run the steps a user would and compare what it prints with the task."
after = "Check the real app with the try command after each change. Write test files only if the task asks (then follow the headless_test part). With the try command (below), run the steps a user would and compare what it prints with the task."
checks = "First, before writing any app code, create `checks.txt` with the task's contract as checks (see Checks below). The harness runs them after every change and tells you which fail; build the app until they all pass, then submit. Write pytest files only if the task asks (then follow the headless_test part)."

[try_goal]
none = "Try what the task describes: each key in the contract, starting with no data file and with\nexisting data, and a restart after a change. Compare what it prints with what the task asks for."
checks = "Use it to see why a check fails. Your checks in `checks.txt` are the tests: don't repeat them by hand."

[names.module]
help = "file name of the app module without .py (e.g. the contract's `notes.py` → notes)"
schema = { type = "string", pattern = "^[a-z_][a-z0-9_]{0,40}$" }

[names.app_class]
help = "name of the App subclass"
schema = { type = "string", pattern = "^[A-Z][A-Za-z0-9]{0,40}$" }

[names.title]
help = "a short human title for the app"
schema = { type = "string", maxLength = 60 }

[names.params]
help = """the App __init__ parameters, in the contract's order (exact names), each with a role: data (a file the app writes: it saves to it, e.g. its saved records or favorites), input (a file the app only reads and never writes, e.g. a provided CSV or JSON of records to look up or view), clock (a zero-argument callable returning seconds, for anything timed), seed (for randomness), other (any other argument, e.g. a starting value or size). `file` is the default file name for a data or input parameter (the contract's default if it gives one, e.g. notes.json), and "" for the other roles. [] if the app takes no parameters"""

[names.params.schema]
type = "array"
maxItems = 6
items = { type = "object", properties = { name = { type = "string", pattern = "^[a-z_][a-z0-9_]{0,30}$" }, role = { enum = ["data", "input", "clock", "seed", "other"] }, file = { type = "string", pattern = "^[A-Za-z0-9_.-]{0,40}$" } }, required = ["name", "role", "file"], additionalProperties = false }

[names.empty_value]
help = "for a JSON data file: the saved value when there is no data yet ([] for a list, {} for an object)"
schema = { enum = ["[]", "{}"] }

[names.sample_data]
help = "a small example of the first data or input file's contents, in exactly the format the task describes (2-3 records), or \"\" if there is no such file or the format is unknown"
schema = { type = "string", maxLength = 1500 }

[[parts]]
name = "headless_test"
when = "only when the task asks for test files: pytest tests that drive the app headlessly"

[[parts]]
name = "list_actions"
when = "a list of items with key actions on the highlighted one (toggle, delete, edit)"

[[parts]]
name = "input_form"
when = "text inputs with validation, submit on enter, live recompute, Select/Checkbox"

[[parts]]
name = "modal"
when = "a dialog over the app that returns a result (confirm, add/edit form)"

[[parts]]
name = "data_table"
when = "tabular records with a row cursor, sorting, selecting a row"

[[parts]]
name = "filter"
when = "filter-as-you-type: an input narrowing what a list or table shows"

[[parts]]
name = "periodic_refresh"
when = "anything that updates on a timer (clock, stopwatch, monitor), with a testable tick"

[[parts]]
name = "worker"
when = "slow or blocking work (file scans, lookups) without freezing the UI"

[[parts]]
name = "tree_detail"
when = "a tree (JSON, folders, outline) on the left and details of the selected node on the right"

[[parts]]
name = "screens_tabs"
when = "several screens or tabs, switching between them and passing data"

[[parts]]
name = "grid_game"
when = "a grid of cells driven by keys or clicks (board games, simulations)"

[[parts]]
name = "text_editor"
when = "editing text with TextArea: load, save, unsaved-changes flag"

[[parts]]
name = "sqlite_store"
when = "keeping records in a sqlite database file instead of JSON"

[[parts]]
name = "file_loader"
when = "reading an input file given as an argument (CSV, JSON, text) with clear errors"
