# Endpoints the bench and harness can talk to. All OpenAI-compatible.
# caps: what the endpoint supports (see lightness.provider.Caps; probe with scripts/probe.py).
# mode: harness strictness for this model — "strict" (constrained action menu only) or
#       "loose" (adds a free sandboxed bash action).

[qwen27]
base_url = "http://127.0.0.1:8080/v1"
model = "qwen27"
context = 65536
mode = "strict"
caps = { json_schema = true, thinking_toggle = true, thinking_budget_field = "thinking_budget_tokens" }

[qwen35a3]
base_url = "http://127.0.0.1:8080/v1"
model = "qwen35a3"
context = 65536
mode = "strict"
caps = { json_schema = true, thinking_toggle = true, thinking_budget_field = "thinking_budget_tokens" }

[qwen9]
base_url = "http://127.0.0.1:8081/v1"
model = "qwen9"
context = 65536
mode = "strict"
caps = { json_schema = true, thinking_toggle = true, thinking_budget_field = "thinking_budget_tokens" }

# Liquid AI. Sampling (temp 0.1, top_k 50, repetition penalty) is set server-side in serve.sh.
[lfm24]
base_url = "http://127.0.0.1:8080/v1"
model = "lfm24"
context = 65536
mode = "strict"
# always thinks, even with enable_thinking off; a zero budget turns it off (probed 2026-11-12)
caps = { json_schema = true, thinking_toggle = true, thinking_budget_field = "thinking_budget_tokens", thinking_off_by_budget = true }

[lfm3]
base_url = "http://127.0.0.1:8081/v1"
model = "lfm3"
context = 65536
mode = "strict"
caps = { json_schema = true, thinking_toggle = true, thinking_budget_field = "thinking_budget_tokens" }

# Hosted models (MIT Parley). The key comes from $OPENAI_API_KEY or the git-ignored .env.parley.
# timeout: seconds per request (local models keep the client default, 900 s).
# The proxy ignores reasoning_effort; GPT-5 models always reason and don't return the reasoning.

[nano]
base_url = "https://parley.api.mit.edu/v1"
timeout = 60  # a stalled request is retried after a minute (provider retries)
model = "gpt-5-nano"
api_key_env = "OPENAI_API_KEY"
env_file = ".env.parley"
context = 65536
mode = "strict"
caps = { json_schema = true, thinking_toggle = false, thinking_budget_field = "", reasoning_reserve = 8000, tool_required = true }

[maverick]
base_url = "https://parley.api.mit.edu/v1"
timeout = 60  # a stalled request is retried after a minute (provider retries)
model = "llama-4-maverick-17b"
api_key_env = "OPENAI_API_KEY"
env_file = ".env.parley"
context = 65536
mode = "strict"
caps = { json_schema = true, thinking_toggle = false, thinking_budget_field = "", max_output = 8192 }  # Bedrock: no tool_choice=required

