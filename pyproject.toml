[project]
name = "lightness"
version = "0.1.0"
description = "lightness — a lightning-fast coding harness for small local LLMs"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "mini-swe-agent>=2.4.6",
    "pytest>=9.2.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
