type: data-script
dimensions:
  - {id: input_variants, hint: "Which input formats and variants must be accepted (delimiters, encodings, header names)"}
  - {id: ambiguous_values, hint: "How to read ambiguous values: dates like 04/03, decimal commas, negative amounts"}
  - {id: normalisation, hint: "How text is cleaned: trimming, collapsing spaces, case"}
  - {id: duplicates, hint: "What counts as a duplicate and which copy is kept"}
  - {id: invalid_rows, hint: "Rows that can't be parsed: skip, report, or fail"}
  - {id: inclusion_rules, hint: "Which records count toward results (statuses, cancelled/refunded items, filters)"}
  - {id: calculations, hint: "How totals and metrics are computed (what's included, discounts, rounding)"}
  - {id: ranking, hint: "What 'top' or 'best' is ranked by, and tie-breaking"}
  - {id: output_format, hint: "Output columns, order, number formatting, sorting of rows"}
  - {id: reruns, hint: "Re-running on the same or overlapping input: append, replace, or deduplicate"}
  - {id: special_cases, hint: "Particular records or values that need different handling from the general rule"}
test_fixture: |
  # Run the program the way a user would, on files created in pytest's tmp_path.
  import json, subprocess, sys
  from pathlib import Path

  def run(*args, cwd=None):
      r = subprocess.run([sys.executable, *args], capture_output=True, text=True, cwd=cwd, timeout=60)
      return r

  def test_example(tmp_path: Path):
      (tmp_path / "input.txt").write_text("...")
      r = run("tool.py", str(tmp_path), "--json")
      assert r.returncode == 0, r.stderr
      data = json.loads(r.stdout)
      assert data == [...]          # assert exact expected content, not just that it exists
